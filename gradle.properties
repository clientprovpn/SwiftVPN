# Tuned for a 4 GB build machine. Raise -Xmx on a bigger workstation
# (e.g. -Xmx4096m) for faster builds.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Keep the Kotlin compiler in the Gradle process instead of forking a second
# JVM, which matters on memory-constrained machines.
kotlin.compiler.execution.strategy=in-process
